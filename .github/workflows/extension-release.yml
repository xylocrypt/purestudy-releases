name: Publish browser extension

on:
  push:
    tags:
      - "extension-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#extension-}"
          zip="$(find extension -maxdepth 1 -name 'PureStudy-Extension-*.zip' -print -quit)"
          test -n "$zip"
          gh release create "$GITHUB_REF_NAME" \
            "$zip#PureStudy Extension ${version} (Chrome + Edge)" \
            "extension/SHA256SUMS.txt#SHA-256 checksum" \
            --title "PureStudy Browser Extension ${version}" \
            --notes-file extension/README.md
